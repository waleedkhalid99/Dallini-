name: Build Dallini APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix android build files
        run: |
          rm -rf android
          mv lib/main.dart /tmp/main.dart
          mv pubspec.yaml /tmp/pubspec.yaml
          flutter create . --project-name dallini --org com.example --overwrite
          mv /tmp/main.dart lib/main.dart
          mv /tmp/pubspec.yaml pubspec.yaml
          # fix kotlin version
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK
          path: build/app/outputs/flutter-apk/app-release.apk
