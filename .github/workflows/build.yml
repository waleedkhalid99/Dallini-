name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name dallini
      - name: Force SDK 23
        run: |
          echo "flutter.minSdkVersion=23" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
      - name: Build with Gradle directly to see error
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --info
      - name: Upload APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK-Iraq
          path: build/app/outputs/flutter-apk/app-debug.apk
