name: Build Dallini APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: create android and fix config
        run: |
          mv lib/main.dart /tmp/main.dart
          flutter create . --project-name dallini --overwrite
          mv /tmp/main.dart lib/main.dart
          flutter pub get
          # fix minSdk for map
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk 21/' android/app/build.gradle || true
      - run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK-Map
          path: build/app/outputs/flutter-apk/app-debug.apk
