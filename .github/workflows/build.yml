name: build dallini apk
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: create android and get packages
        run: |
          flutter create . --platforms=android --project-name dallini --overwrite
          flutter pub get
      - name: build apk with map
        run: flutter build apk --release --no-tree-shake-icons
      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: dallini-map-apk
          path: build/app/outputs/flutter-apk/app-release.apk
