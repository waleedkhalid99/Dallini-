name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Project Name
        run: sed -i "s/^name: .*/name: dallini/" pubspec.yaml

      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name dallini

      - name: FORCE Fix SDK versions in gradle
        run: |
          # نفلش كلشي ونخلي minSdk = 23 غصب
          sed -i "s/minSdkVersion.*/minSdkVersion 23/" android/app/build.gradle
          sed -i "s/flutter.minSdkVersion.*/23/" android/app/build.gradle
          sed -i "s/compileSdkVersion.*/compileSdkVersion 34/" android/app/build.gradle
          sed -i "s/targetSdkVersion.*/targetSdkVersion 34/" android/app/build.gradle
          echo "--- بعد التصليح ---"
          cat android/app/build.gradle | grep -A2 -B2 SdkVersion

      - name: Build APK
        run: flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK-Iraq
          path: build/app/outputs/flutter-apk/app-debug.apk
