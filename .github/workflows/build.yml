name: Build Dallini APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Fix Gradle project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name dallini
          # اضافة صلاحيات العراق كله
          echo '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.INTERNET" />' | cat - android/app/src/main/AndroidManifest.xml > temp && mv temp android/app/src/main/AndroidManifest.xml || true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK-Iraq
          path: build/app/outputs/flutter-apk/app-debug.apk
