name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Project Name
        run: |
          sed -i 's/^name: .*/name: dallini/' pubspec.yaml
          cat pubspec.yaml | head -5

      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name dallini

      - name: Fix Min SDK for Plugins
        run: |
          echo "flutter.minSdkVersion=24" >> android/local.properties
          sed -i 's/flutter.minSdkVersion=.*/flutter.minSdkVersion=24/' android/local.properties
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk = 24/' android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK-Iraq
          path: build/app/outputs/flutter-apk/app-debug.apk
