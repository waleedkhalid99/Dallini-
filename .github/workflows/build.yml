name: Build Dallini APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          cp lib/main.dart /tmp/myapp.dart
          flutter create . --project-name dallini --org com.dallini.app --platforms=android
          cp /tmp/myapp.dart lib/main.dart
          flutter pub get
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK
          path: build/app/outputs/flutter-apk/app-release.apk
