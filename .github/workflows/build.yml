name: Build Dallini APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: |
          cp lib/main.dart /tmp/app.dart
          cp pubspec.yaml /tmp/pub.yaml
          flutter create . --project-name dallini --org com.dallini.app --platforms=android --overwrite
          cp /tmp/app.dart lib/main.dart
          cp /tmp/pub.yaml pubspec.yaml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK
          path: build/app/outputs/flutter-apk/app-release.apk
