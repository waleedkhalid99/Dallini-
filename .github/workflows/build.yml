name: Build Dallini APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Recreate android with new Kotlin
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name dallini --org com.example.dallini
          echo "--- Before fix ---"
          cat android/settings.gradle
          sed -i 's/"org.jetbrains.kotlin.android" version ".*"/"org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle
          echo "--- After fix ---"
          cat android/settings.gradle
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Dallini-APK
          path: build/app/outputs/flutter-apk/app-release.apk
